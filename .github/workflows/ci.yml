name: Security and quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: Verify production fails closed without secrets
        run: '! NODE_ENV=production node server/index.js'
      - name: Build hardened container
        run: docker build -t nozzz:${{ github.sha }} .
